<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reverence — Admin</title>
<style>
  :root{
    --bg: #0b0b0a;
    --bg-raised: #151412;
    --ink: #f2efe8;
    --muted: #8f8c83;
    --muted-dim: #64625b;
    --line: #2c2a26;
    --line-strong: #4c4941;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; font-family: var(--font); }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-weight: 300;
    line-height: 1.5;
    min-height: 100vh;
  }

  .wrap{ max-width: 760px; margin: 0 auto; padding: 4rem 1.5rem; }

  h1{ font-weight: 200; font-size: 1.6rem; margin: 0 0 0.5rem; }
  .sub{ color: var(--muted); font-size: 0.9rem; margin: 0 0 2.5rem; }

  /* login */
  #login-view{ max-width: 360px; }
  .field{ display:flex; flex-direction:column; gap:0.4rem; margin-bottom: 1.25rem; }
  .field label{
    font-size: 0.68rem; font-weight: 400; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
  }
  .field input{
    background: transparent; border: 0; border-bottom: 1px solid var(--line-strong);
    color: var(--ink); font-size: 1rem; padding: 0.5rem 0.1rem; outline: none;
  }
  .field input:focus-visible{ border-color: var(--ink); }

  button{
    font-size: 0.78rem; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase;
    background: transparent; color: var(--ink); border: 1px solid var(--line-strong);
    padding: 0.75rem 1.6rem; cursor: pointer;
  }
  button:hover{ background: var(--ink); color: var(--bg); }
  button:disabled{ opacity: 0.5; cursor: default; background: transparent; color: var(--ink); }

  .msg{ font-size: 0.85rem; color: var(--muted); min-height: 1.2em; margin-top: 1rem; }
  .msg[data-tone="error"]{ color: #c98a7a; }

  /* dashboard */
  #dash-view{ display:none; }
  .dash-header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--line); padding-bottom: 1.5rem; margin-bottom: 1.5rem;
  }
  .stat{ font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; }
  .stat strong{ color: var(--ink); font-weight: 400; }
  .actions-row{ display:flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }

  table{ width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th{
    text-align: left; font-weight: 400; font-size: 0.66rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--line-strong);
  }
  td{ padding: 0.7rem 0.75rem; border-bottom: 1px solid var(--line); }
  tr:hover td{ background: var(--bg-raised); }
  td.email{ color: var(--ink); }
  td.date{ color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .empty{ color: var(--muted); font-size: 0.9rem; padding: 2rem 0; text-align: center; }

  .table-wrap{ overflow-x: auto; }

  #logout-btn{ font-size: 0.72rem; padding: 0.5rem 1rem; }
</style>
</head>
<body>

<div class="wrap">
  <h1>Reverence</h1>
  <p class="sub">Signup admin</p>

  <div id="login-view">
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email-input">Email</label>
        <input type="email" id="email-input" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password-input">Password</label>
        <input type="password" id="password-input" autocomplete="current-password" required>
      </div>
      <button type="submit" id="login-btn">Sign in</button>
      <div class="msg" id="login-msg" role="status"></div>
    </form>
  </div>

  <div id="dash-view">
    <div class="dash-header">
      <span class="stat"><strong id="count-stat">0</strong> signups</span>
      <button id="logout-btn" type="button">Sign out</button>
    </div>
    <div class="actions-row">
      <button id="copy-emails-btn" type="button">Copy all emails</button>
      <button id="export-csv-btn" type="button">Export CSV</button>
      <button id="refresh-btn" type="button">Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>Signed up</th></tr>
        </thead>
        <tbody id="signups-body"></tbody>
      </table>
      <div class="empty" id="empty-msg" style="display:none;">No signups yet.</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://sipgudlnwovlbkjcjxkb.supabase.co";
  var SUPABASE_KEY = "sb_publishable_1dU8DcIsdhK3cXI1S2W2WA_CYmfWDCH";
  var SESSION_KEY = "reverence_admin_session";

  var currentRows = [];

  function showMsg(text, tone){
    var el = document.getElementById("login-msg");
    el.textContent = text || "";
    if (tone) el.setAttribute("data-tone", tone); else el.removeAttribute("data-tone");
  }

  function saveSession(session){
    try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
  }

  function loadSession(){
    try{
      var raw = sessionStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function clearSession(){
    try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  }

  function showLogin(){
    document.getElementById("login-view").style.display = "block";
    document.getElementById("dash-view").style.display = "none";
  }

  function showDash(){
    document.getElementById("login-view").style.display = "none";
    document.getElementById("dash-view").style.display = "block";
  }

  function formatDate(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function renderRows(rows){
    currentRows = rows;
    var body = document.getElementById("signups-body");
    var empty = document.getElementById("empty-msg");
    body.innerHTML = "";
    document.getElementById("count-stat").textContent = rows.length;

    if (rows.length === 0){
      empty.style.display = "";
      return;
    }
    empty.style.display = "none";

    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      var tr = document.createElement("tr");

      var tdName = document.createElement("td");
      tdName.textContent = r.name || "—";
      tr.appendChild(tdName);

      var tdEmail = document.createElement("td");
      tdEmail.className = "email";
      tdEmail.textContent = r.email;
      tr.appendChild(tdEmail);

      var tdDate = document.createElement("td");
      tdDate.className = "date";
      tdDate.textContent = formatDate(r.created_at);
      tr.appendChild(tdDate);

      body.appendChild(tr);
    }
  }

  function fetchSignups(accessToken){
    return fetch(SUPABASE_URL + "/rest/v1/signups?select=name,email,created_at&order=created_at.desc", {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken
      }
    }).then(function(res){
      if (!res.ok) throw new Error("fetch failed: " + res.status);
      return res.json();
    });
  }

  function loadDashboard(){
    var session = loadSession();
    if (!session || !session.access_token){
      showLogin();
      return;
    }
    showDash();
    fetchSignups(session.access_token).then(renderRows).catch(function(){
      clearSession();
      showLogin();
      showMsg("Your session expired — please sign in again.", "error");
    });
  }

  function handleLogin(e){
    e.preventDefault();
    var email = document.getElementById("email-input").value.trim();
    var password = document.getElementById("password-input").value;
    var btn = document.getElementById("login-btn");

    btn.disabled = true;
    showMsg("Signing in…");

    fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(res){
      return res.json().then(function(body){
        if (!res.ok) throw new Error(body && body.error_description || body && body.msg || "Sign-in failed");
        return body;
      });
    }).then(function(body){
      saveSession({ access_token: body.access_token });
      showMsg("");
      document.getElementById("password-input").value = "";
      loadDashboard();
    }).catch(function(err){
      showMsg(err.message || "That email or password isn't right.", "error");
    }).finally(function(){
      btn.disabled = false;
    });
  }

  function handleLogout(){
    clearSession();
    renderRows([]);
    showLogin();
  }

  function handleCopyEmails(){
    var emails = currentRows.map(function(r){ return r.email; }).join(", ");
    var btn = document.getElementById("copy-emails-btn");
    var original = btn.textContent;
    try{
      navigator.clipboard.writeText(emails).then(function(){
        btn.textContent = "Copied";
        setTimeout(function(){ btn.textContent = original; }, 1500);
      }).catch(function(){});
    }catch(e){}
  }

  function csvEscape(v){
    var s = String(v == null ? "" : v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function handleExportCsv(){
    var lines = ["Name,Email,Signed up"];
    for (var i = 0; i < currentRows.length; i++){
      var r = currentRows[i];
      lines.push([csvEscape(r.name || ""), csvEscape(r.email), csvEscape(r.created_at)].join(","));
    }
    var blob = new Blob([lines.join("\n")], { type: "text/csv" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "reverence-signups.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function handleRefresh(){
    var session = loadSession();
    if (!session) { showLogin(); return; }
    fetchSignups(session.access_token).then(renderRows).catch(function(){});
  }

  document.getElementById("login-form").addEventListener("submit", handleLogin);
  document.getElementById("logout-btn").addEventListener("click", handleLogout);
  document.getElementById("copy-emails-btn").addEventListener("click", handleCopyEmails);
  document.getElementById("export-csv-btn").addEventListener("click", handleExportCsv);
  document.getElementById("refresh-btn").addEventListener("click", handleRefresh);

  loadDashboard();
})();
</script>

</body>
</html>
